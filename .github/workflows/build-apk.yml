name: Build & Release Readify Gazette Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Make Gradle Wrapper Executable & Assemble Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy & Rename APK Binary
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Readify_Gazette.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Readify_Gazette_APK
          path: Readify_Gazette.apk

      - name: Create Automated GitHub Release with 1-Click APK Download
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Readify Gazette v1.0.0 (Ready-to-Install APK)"
          body: |
            ## 📰 Readify Gazette — Broadsheet eReader & Audiobook App
            
            ### 📱 Download & Install:
            Click **`Readify_Gazette.apk`** below to download and install directly on your Android phone!
            
            ### 🌟 Included Features:
            - **PDF, EPUB, TXT, MD, HTML** document reading engine.
            - **Text-to-Speech Audiobook Engine** with live sentence highlighting.
            - **Broadsheet Gazette & Letterpress Aesthetics** (Paper, Parchment & Night Press modes).
            - **100% Offline Security & CSP Protection**.
          files: |
            Readify_Gazette.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
